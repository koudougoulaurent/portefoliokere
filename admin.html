<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Portfolio Guillaume KERE</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts - Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Admin CSS -->
    <link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
    <!-- Login Section -->
    <section id="loginSection" class="login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-5 col-md-7">
                    <div class="login-card">
                        <div class="login-header">
                            <i class="fas fa-shield-alt"></i>
                            <h2>Administration</h2>
                            <p>Gestion du Portfolio</p>
                        </div>
                        <form id="loginForm" class="login-form">
                            <div class="form-group mb-3">
                                <label for="username" class="form-label">
                                    <i class="fas fa-user me-2"></i>Nom d'utilisateur
                                </label>
                                <input type="text" class="form-control" id="username" placeholder="Entrez votre nom d'utilisateur" required>
                            </div>
                            <div class="form-group mb-4">
                                <label for="password" class="form-label">
                                    <i class="fas fa-lock me-2"></i>Mot de passe
                                </label>
                                <input type="password" class="form-control" id="password" placeholder="Entrez votre mot de passe" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">
                                <i class="fas fa-sign-in-alt me-2"></i>Se connecter
                            </button>
                        </form>
                        <div class="login-info mt-4">
                            <p class="text-muted small text-center">
                                <i class="fas fa-info-circle me-2"></i>
                                Par défaut: <strong>admin</strong> / <strong>admin123</strong>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Admin Dashboard -->
    <section id="adminDashboard" class="admin-dashboard d-none">
        <!-- Header -->
        <header class="admin-header">
            <div class="container-fluid">
                <div class="row align-items-center">
                    <div class="col-md-6">
                        <h1 class="admin-title">
                            <i class="fas fa-tachometer-alt me-2"></i>
                            Tableau de bord
                        </h1>
                    </div>
                    <div class="col-md-6 text-end">
                        <a href="index.html" class="btn btn-outline-primary me-2" target="_blank">
                            <i class="fas fa-eye me-2"></i>Voir le site
                        </a>
                        <button class="btn btn-danger" id="logoutBtn">
                            <i class="fas fa-sign-out-alt me-2"></i>Déconnexion
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="admin-content">
            <div class="container-fluid">
                <!-- Statistics Cards -->
                <div class="row mb-4">
                    <div class="col-lg-3 col-md-6 mb-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-primary">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="totalProjects">0</h3>
                                <p>Projets totaux</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-success">
                                <i class="fas fa-check-circle"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="publishedProjects">0</h3>
                                <p>Projets publiés</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-warning">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="draftProjects">0</h3>
                                <p>Brouillons</p>
                            </div>
                        </div>
                    </div>
                    <div class="col-lg-3 col-md-6 mb-3">
                        <div class="stat-card">
                            <div class="stat-icon bg-info">
                                <i class="fas fa-calendar"></i>
                            </div>
                            <div class="stat-info">
                                <h3 id="lastUpdate">-</h3>
                                <p>Dernière MAJ</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Project Button -->
                <div class="row mb-4">
                    <div class="col-12">
                        <button class="btn btn-primary btn-lg" id="addProjectBtn">
                            <i class="fas fa-plus-circle me-2"></i>Ajouter un projet
                        </button>
                    </div>
                </div>

                <!-- Projects List -->
                <div class="row">
                    <div class="col-12">
                        <div class="projects-section">
                            <h3 class="section-title mb-4">
                                <i class="fas fa-list me-2"></i>Mes Projets
                            </h3>
                            <div id="projectsList" class="projects-grid">
                                <!-- Projects will be loaded here dynamically -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </section>

    <!-- Project Modal -->
    <div class="modal fade" id="projectModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">
                        <i class="fas fa-plus-circle me-2"></i>Ajouter un projet
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="projectForm">
                        <input type="hidden" id="projectId">
                        
                        <div class="row">
                            <div class="col-md-8 mb-3">
                                <label for="projectTitle" class="form-label">
                                    <i class="fas fa-heading me-2"></i>Titre du projet *
                                </label>
                                <input type="text" class="form-control" id="projectTitle" placeholder="Ex: Reportage FESPACO 2024" required>
                            </div>
                            <div class="col-md-4 mb-3">
                                <label for="projectDate" class="form-label">
                                    <i class="fas fa-calendar me-2"></i>Date
                                </label>
                                <input type="text" class="form-control" id="projectDate" placeholder="Ex: Mars 2024">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="projectCategory" class="form-label">
                                <i class="fas fa-tag me-2"></i>Catégorie *
                            </label>
                            <select class="form-select" id="projectCategory" required>
                                <option value="">Sélectionnez une catégorie</option>
                                <option value="Reportage">Reportage</option>
                                <option value="Communication">Communication</option>
                                <option value="Montage Vidéo">Montage Vidéo</option>
                                <option value="Design Graphique">Design Graphique</option>
                                <option value="Photographie">Photographie</option>
                                <option value="Community Management">Community Management</option>
                                <option value="Autre">Autre</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="projectDescription" class="form-label">
                                <i class="fas fa-align-left me-2"></i>Description *
                            </label>
                            <textarea class="form-control" id="projectDescription" rows="4" placeholder="Décrivez votre projet..." required></textarea>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="projectImage" class="form-label">
                                    <i class="fas fa-image me-2"></i>URL de l'image
                                </label>
                                <input type="url" class="form-control" id="projectImage" placeholder="https://exemple.com/image.jpg">
                                <small class="text-muted">Ou uploadez une image ci-dessous</small>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="projectImageFile" class="form-label">
                                    <i class="fas fa-upload me-2"></i>Upload d'image
                                </label>
                                <input type="file" class="form-control" id="projectImageFile" accept="image/*">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="projectLink" class="form-label">
                                <i class="fas fa-link me-2"></i>Lien externe (optionnel)
                            </label>
                            <input type="url" class="form-control" id="projectLink" placeholder="https://exemple.com">
                        </div>

                        <div class="mb-3">
                            <label for="projectTags" class="form-label">
                                <i class="fas fa-tags me-2"></i>Tags (séparés par des virgules)
                            </label>
                            <input type="text" class="form-control" id="projectTags" placeholder="Ex: vidéo, reportage, FESPACO">
                        </div>

                        <div class="form-check form-switch mb-3">
                            <input class="form-check-input" type="checkbox" id="projectPublished" checked>
                            <label class="form-check-label" for="projectPublished">
                                <i class="fas fa-eye me-2"></i>Publier ce projet
                            </label>
                        </div>

                        <div id="imagePreview" class="image-preview d-none mb-3">
                            <img src="" alt="Aperçu" id="previewImg">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        <i class="fas fa-times me-2"></i>Annuler
                    </button>
                    <button type="button" class="btn btn-primary" id="saveProjectBtn">
                        <i class="fas fa-save me-2"></i>Enregistrer
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Admin JS -->
    <script src="assets/js/admin.js"></script>
</body>
</html>
